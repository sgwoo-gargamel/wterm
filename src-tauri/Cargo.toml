[package]
name = "wterm"
version = "0.1.10"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serialport: port enumeration only (USB product names, Bluetooth detection);
# session I/O uses serial2-tokio, whose overlapped I/O on Windows lets reads and
# writes run concurrently — serialport's sync handles block each other there.
serialport = "4.9.0"
serial2-tokio = "0.1.25"
russh = { version = "0.62.4", default-features = false, features = ["ring", "flate2", "rsa"] }
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4"] }
tokio = { version = "1.53.1", features = ["sync", "net", "time", "io-util", "macros", "rt"] }
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Gdi", "Win32_Foundation"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.7.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
portable-pty = "0.9.0"

